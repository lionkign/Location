<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تۆماری لۆکەیشنی بنکەکان | IHEC</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
        }

        * { box-sizing: border-box; font-family: 'Noto Kufi Arabic', sans-serif; }

        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: var(--bg-gradient); color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 30px;
            border-radius: 30px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%; max-width: 420px; text-align: center;
        }

        .icon-box {
            width: 70px; height: 70px; background: rgba(99, 102, 241, 0.2);
            color: var(--primary); border-radius: 20px; display: flex;
            justify-content: center; align-items: center; font-size: 30px;
            margin: 0 auto 20px; border: 1px solid rgba(99, 102, 241, 0.3);
        }

        h2 { margin-bottom: 10px; font-size: 22px; font-weight: 700; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 30px; }

        .input-group { text-align: right; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #cbd5e1; padding-right: 5px; }

        input {
            width: 100%; padding: 14px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05); color: white; font-size: 16px;
            outline: none; transition: 0.3s; text-align: right;
        }

        input:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }

        #sendBtn {
            width: 100%; padding: 16px; border-radius: 15px; border: none;
            background: var(--primary); color: white; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: 0.3s; display: flex; justify-content: center;
            align-items: center; gap: 10px; margin-top: 10px;
        }

        #sendBtn:hover { background: var(--primary-hover); transform: translateY(-2px); }
        #sendBtn:disabled { background: #475569; cursor: not-allowed; transform: none; }

        .spinner {
            width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #status { margin-top: 20px; padding: 12px; border-radius: 12px; font-size: 13px; display: none; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .footer { margin-top: 30px; font-size: 10px; color: #64748b; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-box">📍</div>
    <h2>تۆمارکردنی لۆکەیشنی بنکە</h2>
    <p>تکایە مەجوڵێ تاوەکو وردترین لۆکەیشن تۆمار دەکرێت</p>

    <div class="input-group">
        <label>ژمارەی بنکە (Office ID)</label>
        <input type="number" id="branchID" placeholder="نموونە: 1">
    </div>

    <div class="input-group">
        <label>ناوی بنکە (Office Name)</label>
        <input type="text" id="branchName" placeholder="نموونە: بنکەی حسارۆک">
    </div>

    <button id="sendBtn" onclick="processLocation()">
        <span class="spinner" id="loader"></span>
        <span id="btnText">تۆمارکردنی ئێستا</span>
    </button>

    <div id="status"></div>
    <div class="footer">IHEC ERBIL OFFICE • 2026</div>
</div>

<script>
    // زانیارییەکانی سوپابەیس
    const SUPABASE_URL = 'https://ihejchpsjhzifkycacnt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloZWpjaHBzamh6aWZreWNhY250Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MjA1MTUsImV4cCI6MjA5MTI5NjUxNX0.Slre8cX9dR-o8S_jXVjlDFLbUFMv-pe9J8P-ZNs2qSw';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let watchID = null;

    async function processLocation() {
        const branchID = document.getElementById('branchID').value;
        const branchName = document.getElementById('branchName').value;
        const btn = document.getElementById('sendBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');

        if (!branchID || !branchName) {
            showStatus("تکایە هەردوو خانەکە پڕ بکەرەوە", "error");
            return;
        }

        btn.disabled = true;
        loader.style.display = "inline-block";
        btnText.innerText = "گەڕان بۆ وردترین لۆکەیشن...";

        let bestPosition = null;
        let count = 0;

        if (navigator.geolocation) {
            watchID = navigator.geolocation.watchPosition(async (position) => {
                count++;
                const currentAcc = position.coords.accuracy;
                
                btnText.innerText = `وردی: ${Math.round(currentAcc)}m (هەوڵی ${count})`;

                if (!bestPosition || currentAcc < bestPosition.coords.accuracy) {
                    bestPosition = position;
                }

                // ئەگەر وردیەکە گەیشتە ژێر ١٥ مەتر یان ١٢ جار هەوڵی دا، پاشەکەوتی بکە
                if (currentAcc <= 15 || count >= 12) {
                    stopAndSave(bestPosition, branchID, branchName);
                }

            }, (err) => {
                showStatus("GPS کار ناکات: " + err.message, "error");
                stopWatch();
            }, { enableHighAccuracy: true, timeout: 45000, maximumAge: 0 });

            // کاتی چاوەڕوانی کۆتایی
            setTimeout(() => {
                if (watchID && bestPosition) {
                    stopAndSave(bestPosition, branchID, branchName);
                } else if (watchID) {
                    showStatus("کات تەواو بوو، لۆکەیشن نەدۆزرایەوە", "error");
                    stopWatch();
                }
            }, 40000);

        } else {
            showStatus("وێبگەڕەکەت GPS پشتگیری ناکات", "error");
            btn.disabled = false;
        }
    }

    async function stopAndSave(position, bID, bName) {
        stopWatch();
        const btnText = document.getElementById('btnText');
        btnText.innerText = "خەریکی پاشەکەوتکردنم...";

        try {
            const { latitude, longitude } = position.coords;

            // گونجاندن لەگەڵ تەیبڵی offices
            const { error } = await _supabase
                .from('offices') 
                .insert([{ 
                    office_id: parseInt(bID), 
                    office_name: bName, 
                    lat: latitude, 
                    long: longitude,
                    radius_meters: 100 // بازنەی ڕێپێدراوی ستاندارد (١٠٠ مەتر)
                }]);

            if (error) throw error;

            showStatus(`بنکەی (${bName}) بە سەرکەوتوویی تۆمار کرا!`, "success");
            document.getElementById('branchID').value = "";
            document.getElementById('branchName').value = "";
        } catch (err) {
            showStatus("هەڵەیەک ڕوویدا: " + err.message, "error");
        } finally {
            resetBtn();
        }
    }

    function stopWatch() {
        if (watchID !== null) {
            navigator.geolocation.clearWatch(watchID);
            watchID = null;
        }
    }

    function resetBtn() {
        const btn = document.getElementById('sendBtn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btnText');
        btn.disabled = false;
        loader.style.display = "none";
        btnText.innerText = "تۆمارکردنی ئێستا";
    }

    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.innerText = msg;
        statusDiv.style.background = type === "error" ? "rgba(239, 68, 68, 0.1)" : "rgba(34, 197, 94, 0.1)";
        statusDiv.style.color = type === "error" ? "#f87171" : "#4ade80";
        statusDiv.style.border = `1px solid ${type === "error" ? "#ef4444" : "#22c55e"}`;
    }
</script>

</body>
</html>
